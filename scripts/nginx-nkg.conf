# Nginx vhost for NKG (production-style deployment on small server)
#
# 部署：
#   1. 改 server_name 为你的域名或公网 IP
#   2. 改 root 路径为你的 frontend/dist 绝对路径
#   3. sudo cp scripts/nginx-nkg.conf /etc/nginx/sites-available/nkg
#   4. sudo ln -s /etc/nginx/sites-available/nkg /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Nginx 内存占用 ~10-20 MB,vs vite dev server 的 400-500 MB。
# 加上 gzip 压缩,首屏加载也快一档。

server {
    listen 80;
    server_name _;   # 改为你的域名,如 nkg.example.com 或公网 IP

    # 前端静态文件
    root /home/ubuntu/projects/Database-Course-Project/frontend/dist;
    index index.html;

    # 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 5;

    # SPA 路由：所有未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 静态资源长缓存 (Vite 文件名带 hash,可以放心 immutable)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理 → uvicorn :8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 调用可能超过 60s 默认超时
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
    }

    # 文件上传放宽 (默认 1M)
    client_max_body_size 32M;

    # 隐藏 nginx 版本号
    server_tokens off;
}
